# Publishes the package to npm when a vX.Y.Z tag is pushed, through npm Trusted Publishing:
# npm accepts the publish only from this repository and this workflow, by OIDC, with no token.
#
# ONE-TIME SETUP: on npmjs.com, the package's Settings → Trusted Publisher → GitHub Actions,
# with organization Funnelchat20, repository funnelchat-cli, workflow publish.yml and no environment.
#
# Run it by hand (workflow_dispatch) to check the OIDC exchange with npm without publishing.
name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Two runs for the same tag would both try to publish the same version.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Developing and building need Node 20 or later (see README); 22 is the maintained LTS,
      # and npm 11 needs ^20.17.0 || >=22.9.0.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # npm 11.5.1 is the first to exchange the OIDC token; npm 12 asks for Node versions the runners do not guarantee yet.
      - run: npm install -g 'npm@^11.5.1'

      - name: Check the OIDC exchange with npm (no publish)
        if: github.event_name == 'workflow_dispatch'
        run: |
          name="$(node -p "require('./package.json').name")"

          response="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")"
          id_token="$(jq -r '.value' <<< "${response}")"
          echo "::add-mask::${id_token}"

          response="$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${id_token}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name/\//%2f}")"
          status="${response##*$'\n'}"
          npm_token="$(jq -r '.token // empty' <<< "${response%$'\n'*}" 2>/dev/null || true)"
          if [ -n "${npm_token}" ]; then
            echo "::add-mask::${npm_token}"
          fi

          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Trusted publishing failed for ${name}: HTTP ${status}"
            exit 1
          fi
          echo "Trusted publishing OK for ${name}"

      - name: Check that package.json matches the tag
        if: github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi

      - name: Skip a version that is already on npm
        id: published
        if: github.event_name != 'workflow_dispatch'
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$(npm view "${name}@${version}" version 2>/dev/null || true)" = "${version}" ]; then
            echo "::notice::${name}@${version} is already on npm; nothing to publish"
            echo "already=true" >> "${GITHUB_OUTPUT}"
          fi

      - if: github.event_name != 'workflow_dispatch' && steps.published.outputs.already != 'true'
        run: npm ci

      # prepack builds dist/ before packing.
      - if: github.event_name != 'workflow_dispatch' && steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public
