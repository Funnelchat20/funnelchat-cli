# Publishes the package to npm when a vX.Y.Z tag is pushed, through npm Trusted Publishing:
# npm accepts the publish only from this repository and this workflow, by OIDC, with no token.
#
# Before publishing, it fails unless the tag matches package.json and its commit is on main, and it runs
# lint, types and tests. A pre-release (vX.Y.Z-rc.N, vX.Y.Z-beta.N…) goes to the `next` dist-tag, never to
# `latest`, the one `npm install` gives by default.
#
# ONE-TIME SETUP: on npmjs.com, the package's Settings → Trusted Publisher → GitHub Actions,
# with organization Funnelchat20, repository funnelchat-cli, workflow publish.yml and no environment.
#
# Run it by hand (workflow_dispatch) to check the OIDC exchange with npm without publishing.
name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Two runs for the same tag would both try to publish the same version.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: the tag's commit is checked against main.
          fetch-depth: 0

      # Developing and building need Node 20.19 or later (see README); 22 is the maintained LTS,
      # and npm 11 needs ^20.17.0 || >=22.9.0.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # npm 11.5.1 is the first to exchange the OIDC token; npm 12 asks for Node versions the runners do not guarantee yet.
      - run: npm install -g 'npm@^11.5.1'

      - name: Check the OIDC exchange with npm (no publish)
        if: github.event_name == 'workflow_dispatch'
        run: |
          name="$(node -p "require('./package.json').name")"

          response="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")"
          id_token="$(jq -r '.value' <<< "${response}")"
          echo "::add-mask::${id_token}"

          response="$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${id_token}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name/\//%2f}")"
          status="${response##*$'\n'}"
          npm_token="$(jq -r '.token // empty' <<< "${response%$'\n'*}" 2>/dev/null || true)"
          if [ -n "${npm_token}" ]; then
            echo "::add-mask::${npm_token}"
          fi

          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Trusted publishing failed for ${name}: HTTP ${status}"
            exit 1
          fi
          echo "Trusted publishing OK for ${name}"

      - name: Check that package.json matches the tag
        if: github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi

      - name: Check that the tag's commit is on main
        if: github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse 'HEAD^{commit}')"
          if ! git merge-base --is-ancestor "${commit}" origin/main; then
            echo "::error::Tag ${TAG} points to ${commit}, which is not on main: only a commit of main is published"
            exit 1
          fi

      # A version with a pre-release part (0.5.0-rc.1, 0.5.0-beta.2) is never `latest`.
      - name: Choose the npm dist-tag
        id: dist
        if: github.event_name != 'workflow_dispatch'
        run: |
          version="$(node -p "require('./package.json').version")"
          case "${version}" in
            *-*) echo "tag=next" >> "${GITHUB_OUTPUT}" ;;
            *) echo "tag=latest" >> "${GITHUB_OUTPUT}" ;;
          esac

      - name: Skip a version that is already on npm
        id: published
        if: github.event_name != 'workflow_dispatch'
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$(npm view "${name}@${version}" version 2>/dev/null || true)" = "${version}" ]; then
            echo "::notice::${name}@${version} is already on npm; nothing to publish"
            echo "already=true" >> "${GITHUB_OUTPUT}"
          fi

      - if: github.event_name != 'workflow_dispatch' && steps.published.outputs.already != 'true'
        run: npm ci

      - name: Lint, types and tests
        if: github.event_name != 'workflow_dispatch' && steps.published.outputs.already != 'true'
        run: |
          npm run lint
          npm run typecheck
          npm test

      # prepack builds dist/ before packing.
      - if: github.event_name != 'workflow_dispatch' && steps.published.outputs.already != 'true'
        env:
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: npm publish --provenance --access public --tag "${DIST_TAG}"
