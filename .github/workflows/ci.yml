# Checks every pull request and every push to main: install, lint, types, tests (which include
# `npm run generate -- --check`) and build, on the Node versions the repository supports.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request replaces its run; on main every commit is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types, tests and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Developing needs Node 20.19 or later (vite, under vitest, asks for ^20.19.0 || >=22.12.0):
        # the oldest it supports, the maintained LTS and the current one.
        node: ['20.19', '22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  node18:
    # The CLI it builds runs on Node 18 (`engines` in package.json), where the test tools do not:
    # build it on 22, then run it on 18 without network or key.
    name: The built CLI on Node 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Run it
        run: |
          node --version
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null
          node dist/cli.js api list > /dev/null
          node dist/cli.js api message.sendMessage --help > /dev/null
